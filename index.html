<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TalentCity — HR Gamificado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0D1117; }
    #root { min-height: 100vh; }
    #tc-loading {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; background: #0D1117; gap: 16px;
    }
    #tc-loading span { font-family: 'Courier New', monospace; color: #4ECDC4; font-size: 13px; letter-spacing: 2px; }
    .dot { animation: blink 1.2s infinite; }
    @keyframes blink { 0%,100%{opacity:0} 50%{opacity:1} }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.5); }
  </style>
</head>
<body>
  <div id="tc-loading">
    <div style="font-size:36px">🏙️</div>
    <span>CARGANDO TALENTCITY<span class="dot">...</span></span>
    <span id="tc-status" style="font-size:10px;color:#2A3F58"></span>
  </div>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    // ── CONFIGURACIÓN ──────────────────────────────────────────────────────────
    // Reemplazá esta URL con la URL raw de tu archivo JSX en GitHub:
    // Formato: https://raw.githubusercontent.com/nicolasgarcia-byte/talencity/refs/heads/main/TalentCity-v7.jsx
    const JSX_URL = "https://raw.githubusercontent.com/nicolasgarcia-byte/talencity/refs/heads/main/TalentCity-v7.jsx";
    // ──────────────────────────────────────────────────────────────────────────

    async function loadApp() {
      const status = document.getElementById('tc-status');
      try {
        status.textContent = 'Descargando aplicación...';
        const res = await fetch(JSX_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status} al cargar ${JSX_URL}`);
        let code = await res.text();
        status.textContent = 'Compilando...';

        // Remove ES module export (not needed in browser script context)
        code = code.replace(/^export default function TalentCity/m, 'function TalentCity');

        // Transpile JSX with Babel
        const transpiled = Babel.transform(code, {
          presets: ['react'],
          plugins: []
        }).code;

        // Execute the transpiled code to define TalentCity
        // eslint-disable-next-line no-new-func
        new Function(
          'React', 'useState', 'useEffect', 'useRef', 'useCallback',
          transpiled
        )(
          React,
          React.useState, React.useEffect, React.useRef, React.useCallback
        );

        // Mount
        status.textContent = 'Iniciando...';
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(TalentCity));
        document.getElementById('tc-loading').style.display = 'none';

      } catch(err) {
        console.error('TalentCity load error:', err);
        document.getElementById('tc-loading').innerHTML = `
          <div style="font-size:32px">⚠️</div>
          <span style="color:#FF4757">ERROR AL CARGAR</span>
          <span style="font-size:11px;color:#7A8FA6;max-width:400px;text-align:center">${err.message}</span>
          <span style="font-size:10px;color:#2A3F58;max-width:400px;text-align:center">
            Verificá que la URL del JSX en index.html sea correcta y el archivo sea público.
          </span>
          <button onclick="loadApp()" style="margin-top:12px;background:#FFD700;color:#0D1117;border:none;padding:8px 20px;font-family:monospace;font-size:12px;cursor:pointer">↺ REINTENTAR</button>
        `;
      }
    }

    // Wait for Babel to be ready, then load
    window.addEventListener('load', loadApp);
  </script>
</body>
</html>
