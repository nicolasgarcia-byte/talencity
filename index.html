<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mandú by Visma — TalentCity</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#004949}
    #root{min-height:100vh}
    #tc-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#004949;gap:16px}
    #tc-loading span{font-family:"Courier New",monospace;color:#7dc9b2;font-size:13px;letter-spacing:2px}
    .dot{animation:blink 1.2s infinite}
    @keyframes blink{0%,100%{opacity:0}50%{opacity:1}}
    input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.5)}
  </style>
</head>
<body>
  <div id="tc-loading">
    <img src="./logo.png" alt="Mandú" style="height:60px;margin-bottom:8px;opacity:0.9"/>
    <span>CARGANDO<span class="dot">...</span></span>
  </div>
  <div id="root"></div>

  <script>
  window.storage={
    get:async function(k){try{var v=localStorage.getItem(k);return v!==null?{key:k,value:v}:null}catch(e){return null}},
    set:async function(k,v){try{localStorage.setItem(k,v);return{key:k,value:v}}catch(e){return null}},
    delete:async function(k){try{localStorage.removeItem(k);return{key:k,deleted:true}}catch(e){return null}},
    list:async function(p){try{var ks=Object.keys(localStorage).filter(function(k){return!p||k.startsWith(p)});return{keys:ks}}catch(e){return{keys:[]}}}
  };
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="./app.js"></script>

  <script>
  var loader=document.getElementById('tc-loading');
  if(loader)loader.remove();
  ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(window.TalentCity)
  );
  </script>
</body>
</html>
